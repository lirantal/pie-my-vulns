version: 2.1

jobs:
  validate:
    docker:
      - image: node:24
    steps:
      - run:
          name: Checkout source
          command: git clone --depth 1 --branch "$CIRCLE_BRANCH" "$CIRCLE_REPOSITORY_URL" .
      - run: npm ci
      - run: npm run lint
      - run: npm test

workflows:
  validate:
    jobs:
      - validate
